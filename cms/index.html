<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKYTÜRK CMS — Kontrol Paneli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#1F2430; --side2:#181C26; --sidetxt:#AEB6C6; --bg:#F1F3F7; --panel:#fff; --line:#E5E8EE;
  --ink:#1F2937; --ink2:#6B7280; --navy:#0B4F9E; --sky:#2E9BF0; --red:#E8262C; --pink:#E5306D;
  --purple:#6C5CE7; --gold:#F6B93B; --dark:#2D3436; --teal:#4CB8A4; --green:#22A06B;
  --fh:'Oswald',Arial,sans-serif; --fb:'Source Sans 3','Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.fh{font-family:var(--fh)}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.sb{background:var(--side);color:var(--sidetxt);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:auto}
.sb .brand{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:var(--side2)}
.sb .brand .lg{font-family:var(--fh);font-weight:600;font-size:34px;color:var(--sky);letter-spacing:-.02em;line-height:1}
.sb .brand .lg b{color:#fff;font-weight:600}
.sb .brand button{color:var(--sky);font-size:18px}
.sb nav{padding:8px 0 20px}
.sb .grp{margin-top:6px}
.sb .it{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;font-weight:600;font-size:14.5px;border-bottom:1px solid rgba(255,255,255,.04);color:var(--sidetxt)}
.sb .it:hover,.sb .it.on{background:rgba(255,255,255,.05);color:#fff}
.sb .it.on{box-shadow:inset 3px 0 0 var(--sky)}
.sb .it .ic{width:18px;text-align:center;opacity:.7;font-size:15px}
.sb .it .lft{display:flex;align-items:center;gap:8px}
.sb .badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--pink)}
.sb .badge.y{background:var(--gold);color:#222}.sb .badge.b{background:var(--sky)}
.sb .sub{background:rgba(0,0,0,.18)}
.sb .sub a{display:flex;align-items:center;justify-content:space-between;padding:9px 22px 9px 30px;font-size:14px;color:var(--sidetxt)}
.sb .sub a:hover{color:#fff}
.sb .sub a i{width:9px;height:9px;border-radius:50%;border:2px solid var(--c)}
.sb .foot{margin-top:auto;padding:16px 22px;font-size:12px;opacity:.6;border-top:1px solid rgba(255,255,255,.06)}

/* Top bar */
.top{height:76px;background:var(--panel);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 var(--line)}
.top .tl{display:flex;gap:18px;align-items:center;color:var(--ink2)}
.top .tl .mail{position:relative;font-size:18px}
.top .tl .mail i{position:absolute;top:-2px;right:-4px;width:8px;height:8px;background:var(--red);border-radius:50%}
.top .search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px;width:280px;background:#FAFBFD}
.top .search input{border:0;background:transparent;outline:0;flex:1;font-size:14px}
.top .mid{font-family:var(--fh);font-size:30px;font-weight:600;color:var(--navy);letter-spacing:-.01em}
.top .mid b{color:var(--sky);font-weight:600}
.top .mid small{font-family:var(--fb);font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.14em;margin-left:10px;vertical-align:middle}
.top .tr{display:flex;justify-content:flex-end;align-items:center;gap:20px;color:var(--ink2);font-size:18px}
.top .tr a:hover{color:var(--navy)}
.top .lang{font-size:14px;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--ink)}
.top .lang i{width:18px;height:12px;background:var(--red);display:inline-block;border-radius:2px}
.top .av{width:46px;height:46px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-family:var(--fh);font-size:20px;font-weight:600}
.content{padding:26px 28px 40px}

/* Kartlar */
.panel{background:var(--panel);border-radius:6px;box-shadow:0 1px 2px rgba(20,30,60,.06)}
.welcome{padding:38px 30px;text-align:center}
.welcome h1{font-family:var(--fh);font-weight:400;font-size:40px;color:#374151}
.welcome p{color:var(--ink2);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;margin-top:22px}
.stat{border-radius:6px;color:#fff;padding:26px 16px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.08);display:block}
.stat b{display:block;font-family:var(--fh);font-weight:400;font-size:44px;line-height:1}
.stat span{display:block;font-weight:600;font-size:16px;margin-top:8px}
.stat:hover{filter:brightness(1.05)}

.widgets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:22px}
.wh{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px 10px}
.wh h3{font-size:17px;font-weight:700}
.wh small{display:block;color:var(--ink2);font-weight:400;font-size:13px}
.wh .act{display:flex;gap:12px;color:var(--ink2)}
.wh .act button:hover{color:var(--ink)}
.wx-now{background:#F6F8FB;padding:26px 22px;display:flex;justify-content:space-between;align-items:center}
.wx-now .d{font-family:var(--fh);font-weight:400;font-size:34px;color:#4B5563}
.wx-now .d small{display:block;font-family:var(--fb);font-size:12px;color:var(--ink2)}
.wx-now .t{font-family:var(--fh);font-weight:400;font-size:52px;line-height:1;color:#374151;display:flex;align-items:center;gap:8px}
.wx-now .t sup{font-size:18px;vertical-align:top}
.wx-now .t .ico{font-size:44px;color:#F05A28}
.wx-now .t small{font-size:12px;color:var(--ink2);font-family:var(--fb);display:block;text-align:right}
.wx-days{display:grid;grid-template-columns:repeat(4,1fr);padding:22px 12px 26px;text-align:center}
.wx-days b{display:block;font-weight:600;color:#4B5563}
.wx-days i{display:block;font-size:30px;color:#F05A28;margin:8px 0}
.wx-days .tt{font-family:var(--fh);font-size:24px;color:#374151}
.wx-days small{color:var(--ink2);font-size:12px}
.mkt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px 8px;text-align:center}
.mkt div{padding:12px 0}
.mkt .sym{font-family:var(--fh);font-size:32px;line-height:1;color:#4B5563}
.mkt .k{font-weight:700;font-size:13px;margin-top:6px}
.mkt .v{font-family:var(--fh);font-size:26px;color:#6B7280;font-weight:400}
.mkt .d{font-size:13px;font-weight:700}
.up{color:var(--green)}.dn{color:var(--red)}
.src{padding:6px 22px 18px;text-align:right;font-size:12px;color:var(--ink2)}
.prayer{background:var(--teal);color:#fff}
.prayer .wh h3,.prayer .wh small,.prayer .wh .act{color:#fff}
.prayer .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 18px 6px;text-align:center}
.prayer .grid div{padding:14px 0}
.prayer i{display:block;font-size:34px;margin-bottom:8px}
.prayer .k{font-weight:700;font-size:14px}
.prayer .v{font-family:var(--fh);font-size:30px;font-weight:400;margin-top:6px}
.prayer .src{color:rgba(255,255,255,.75)}

/* Tablo */
.tbl-wrap{margin-top:22px}
table{width:100%;border-collapse:collapse}
thead th{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.08em;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}
tbody td{padding:10px 16px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14.5px}
tbody tr:hover{background:#F8FAFC}
tbody tr.draft{background:#FFF6DD}
tbody tr.draft:hover{background:#FFF0C8}
td.th img{width:64px;height:44px;object-fit:cover;border-radius:4px;display:block}
td.title{font-weight:700;color:#111827;max-width:560px}
td.title a:hover{color:var(--navy)}
.st{display:inline-block;padding:4px 10px;border-radius:3px;color:#fff;font-size:12.5px;font-weight:700;background:var(--teal)}
.st.draft{background:var(--red)}.st.plan{background:var(--purple)}.st.arc{background:var(--ink2)}
.st.pending{background:var(--gold);color:#222}
.tbl-foot{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:13px;color:var(--ink2)}
.pg{display:flex;gap:4px}
.pg button{width:32px;height:32px;border:1px solid var(--line);border-radius:4px;font-weight:600;background:#fff}
.pg button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.rowact{display:flex;gap:6px;opacity:0;transition:opacity .15s}
tr:hover .rowact{opacity:1}
.rowact button{width:28px;height:28px;border-radius:4px;border:1px solid var(--line);background:#fff;font-size:13px;color:var(--ink2)}
.rowact button:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.rowact button.del:hover{background:var(--red);border-color:var(--red)}

/* Sayfa başlığı ve araç çubuğu */
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:12px}
.ph h1{font-family:var(--fh);font-weight:500;font-size:30px;color:#374151}
.ph p{color:var(--ink2);font-size:14px}
.btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:5px;font-weight:700;font-size:14px;border:1px solid transparent}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:#093f80}
.btn-s{background:#fff;border-color:var(--line);color:var(--ink)}.btn-s:hover{background:#F3F4F6}
.btn-g{background:var(--green);color:#fff}
.btn-d{background:var(--red);color:#fff}
.toolbar{display:flex;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{height:36px;border:1px solid var(--line);border-radius:5px;padding:0 12px;background:#fff;font-size:14px}
.toolbar input{width:280px}
.toolbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#EEF2FF;color:var(--navy);font-size:12.5px;font-weight:700;margin:2px}

/* Form / editör */
.editor{display:grid;grid-template-columns:1fr 340px;gap:22px}
.field{display:grid;gap:6px;margin-bottom:16px}
.field label{font-size:13px;font-weight:700;color:var(--ink2)}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:5px;padding:10px 12px;background:#fff;font-size:15px;width:100%}
.field input.big{font-size:22px;font-weight:700;font-family:var(--fb)}
.field textarea{min-height:120px;resize:vertical}
.rte{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.rte .bar{display:flex;gap:2px;padding:6px;background:#F8FAFC;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rte .bar button{width:32px;height:30px;border-radius:4px;font-weight:700;font-size:13px;color:#374151}
.rte .bar button:hover{background:#E5E7EB}
.rte .bar .sep{width:1px;background:var(--line);margin:4px 6px}
.rte .area{min-height:340px;padding:16px;outline:0;font-size:16px;line-height:1.65}
.rte .area h2{font-family:var(--fh);font-weight:500;margin:14px 0 8px}
.rte .area p{margin-bottom:12px}
.pbox{padding:16px 18px}
.pbox+.pbox{border-top:1px solid var(--line)}
.pbox h4{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.chk input{width:16px;height:16px;accent-color:var(--navy)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:14px}
.tog{width:40px;height:22px;border-radius:999px;background:#D1D5DB;position:relative;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.tog.on{background:var(--green)}.tog.on::after{left:21px}
.drop{border:2px dashed var(--line);border-radius:6px;padding:26px;text-align:center;color:var(--ink2);font-size:13px;background:#FAFBFD}
.drop b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.tagin{display:flex;flex-wrap:wrap;gap:6px;border:1px solid var(--line);border-radius:5px;padding:6px;background:#fff}
.tagin input{border:0;outline:0;flex:1;min-width:100px;padding:4px}
.seo{background:#F8FAFC;border:1px solid var(--line);border-radius:5px;padding:12px;font-size:13px}
.seo b{color:#1A0DAB;font-size:16px;display:block;font-weight:600}
.seo i{color:#006621;font-style:normal;display:block;margin:2px 0}
.seo span{color:#545454}

/* Kategori / kart listeleri */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ccard{padding:18px;display:flex;flex-direction:column;gap:10px}
.ccard .hd{display:flex;align-items:center;gap:10px}
.ccard .hd i{width:12px;height:12px;border-radius:50%;flex:none}
.ccard .hd b{font-size:16px}
.ccard .hd small{color:var(--ink2);margin-left:auto}
.ccard p{font-size:13px;color:var(--ink2)}
.ccard .ft{display:flex;gap:8px;margin-top:auto}
.ccard .ft button{font-size:13px;font-weight:700;color:var(--navy)}
.media{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px}
.media .m{border-radius:5px;overflow:hidden;border:1px solid var(--line);background:#fff}
.media .m img{aspect-ratio:4/3;width:100%;object-fit:cover;display:block}
.media .m span{display:block;padding:8px;font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmt{display:grid;grid-template-columns:44px 1fr auto;gap:14px;padding:16px;border-bottom:1px solid var(--line);align-items:start}
.cmt .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.cmt b{font-size:14px}.cmt small{color:var(--ink2);margin-left:8px}
.cmt p{margin-top:4px;font-size:14.5px}
.cmt .on{font-size:12px;color:var(--ink2);margin-top:6px}
.cmt .on a{color:var(--navy);font-weight:600}
.cmt .acts{display:flex;gap:6px}
.mini{height:30px;padding:0 10px;border-radius:4px;font-size:12.5px;font-weight:700;border:1px solid var(--line);background:#fff}
.mini.ok{background:var(--green);color:#fff;border-color:var(--green)}
.mini.no{background:#fff;color:var(--red);border-color:var(--red)}
.userrow .av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.role{font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px;background:#EEF2FF;color:var(--navy)}
.settings{display:grid;grid-template-columns:220px 1fr;gap:22px}
.settings .menu a{display:block;padding:12px 16px;font-weight:600;border-bottom:1px solid var(--line);font-size:14px}
.settings .menu a.on{background:#EEF2FF;color:var(--navy);box-shadow:inset 3px 0 0 var(--navy)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.toast{position:fixed;right:24px;bottom:24px;background:#111827;color:#fff;padding:12px 18px;border-radius:6px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(20px);opacity:0;transition:.25s;z-index:99}
.toast.show{transform:none;opacity:1}
.hbar{display:flex;gap:6px;align-items:flex-end;height:120px;padding:10px 16px 0}
.hbar div{flex:1;background:linear-gradient(180deg,var(--sky),var(--navy));border-radius:3px 3px 0 0;position:relative}
.hbar div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:11px;color:var(--ink2)}
.kv{display:grid;grid-template-columns:1fr auto;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.kv b{font-family:var(--fh);font-weight:400;font-size:18px}
@media (max-width:1280px){.stats{grid-template-columns:repeat(3,1fr)}.widgets{grid-template-columns:1fr 1fr}.editor{grid-template-columns:1fr}.media{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){.layout{grid-template-columns:1fr}.sb{display:none}.top{grid-template-columns:1fr auto;padding:0 16px}.top .tl .search{display:none}.top .mid{font-size:22px}.top .mid small{display:none}.content{padding:16px}.stats,.widgets,.cards{grid-template-columns:1fr}.settings{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}

/* Giriş */
.login{position:fixed;inset:0;background:linear-gradient(135deg,#0B4F9E,#14213D);display:grid;place-items:center;z-index:100;padding:20px}
.login .card{background:#fff;border-radius:10px;padding:34px 34px 28px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.login .lg{font-family:var(--fh);font-size:34px;font-weight:600;color:var(--navy);text-align:center;margin-bottom:4px}.login .lg b{color:var(--sky);font-weight:600}
.login .sub{text-align:center;color:var(--ink2);font-size:13px;margin-bottom:22px}
.login .err{background:#FDECEC;color:#B00020;border-radius:5px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;display:none}
.login .btn{width:100%;justify-content:center;height:42px;margin-top:6px}
.login .foot{margin-top:16px;text-align:center;font-size:12px;color:var(--ink2)}
.role-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;background:#EEF2FF;color:var(--navy);text-transform:uppercase;letter-spacing:.04em}
.top .who{display:flex;align-items:center;gap:10px;cursor:pointer}
.top .who small{font-size:12px;color:var(--ink2);line-height:1.2;text-align:right}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="login" id="login"><div class="card">
  <div class="lg">SKY<b>TÜRK</b> <span style="font-family:var(--fb);font-size:12px;letter-spacing:.14em;color:var(--ink2)">CMS</span></div>
  <div class="sub" id="loginSub">Yönetim paneline giriş</div>
  <div class="err" id="loginErr"></div>
  <div id="loginForm">
    <div class="field"><label>Kullanıcı adı</label><input id="lu" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <div class="field"><label>Şifre</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    <button class="btn btn-p" onclick="doLogin()">Giriş yap</button>
  </div>
  <div id="setupForm" class="hidden">
    <p style="font-size:13.5px;color:var(--ink2);margin-bottom:14px">Henüz kullanıcı yok. İlk yönetici hesabını oluşturun; bunun için <b>yayın anahtarı</b> (config.php) gerekir.</p>
    <div class="field"><label>Yayın anahtarı</label><input id="sk" type="password"></div>
    <div class="field"><label>Ad Soyad</label><input id="sn"></div>
    <div class="field"><label>Kullanıcı adı</label><input id="su" placeholder="küçük harf, rakam, nokta"></div>
    <div class="field"><label>Şifre (en az 8 karakter)</label><input id="sp" type="password"></div>
    <button class="btn btn-g" onclick="doSetup()">Yönetici hesabını oluştur</button>
  </div>
  <div class="foot">Kodlayan ve Tasarlayan: E.K. · Oturum 12 saat geçerlidir</div>
</div></div>
<div class="layout" id="layout" style="visibility:hidden">
  <aside class="sb">
    <div class="brand"><a class="lg" href="#/">st<b>.</b></a><button title="Menüyü daralt">◂</button></div>
    <nav id="sbNav"></nav>
    <div class="foot">SKYTÜRK CMS v1.0 · © 2026 SKYTÜRK Medya</div>
  </aside>
  <div>
    <header class="top">
      <div class="tl">
        <a class="mail" href="#/iletisim" title="Gelen mesajlar">✉<i></i></a>
        <div class="search"><span style="color:var(--ink2)">⌕</span><input placeholder="Haber, etiket, üye ara…" onkeydown="if(event.key==='Enter'){location.hash='#/haberler?q='+encodeURIComponent(this.value)}"></div>
      </div>
      <div class="mid">SKY<b>TÜRK</b><small>CMS</small></div>
      <div class="tr">
        <a href="../" target="_blank" title="Siteyi görüntüle">🖥</a>

function authInit(){fetch('../api/auth.php?action=status',{headers:hdrs()}).then(r=>r.json()).then(j=>{
  if(j.user){ME=j.user;showApp();return}
  $('#login').style.display='grid';$('#layout').style.visibility='hidden';
  if(j.setup_needed){$('#loginForm').classList.add('hidden');$('#setupForm').classList.remove('hidden');$('#loginSub').textContent='İlk kurulum'}
  else{$('#loginForm').classList.remove('hidden');$('#setupForm').classList.add('hidden');setTimeout(()=>$('#lu').focus(),50)}
}).catch(()=>{$('#loginErr').style.display='block';$('#loginErr').textContent='Sunucuya ulaşılamadı'})}
function loginErr(m){const e=$('#loginErr');e.style.display=m?'block':'none';e.textContent=m||''}
function doLogin(){loginErr('');fetch('../api/auth.php?action=login',{method:'POST',headers:hdrs(),body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok){loginErr(j.error||'Giriş başarısız');return}SESSION=j.session;localStorage.setItem('skyturk_sess',SESSION);ME=j.user;showApp()}).catch(()=>loginErr('Sunucuya ulaşılamadı'))}
function doSetup(){loginErr('');fetch('../api/auth.php?action=setup',{method:'POST',headers:hdrs({'X-Token':$('#sk').value.trim()}),body:JSON.stringify({name:$('#sn').value,username:$('#su').value,password:$('#sp').value})}).then(async r=>{const j=await r.json();if(!r.ok||!j.ok){loginErr(j.error||'Kurulum başarısız');return}$('#lu').value=$('#su').value;$('#lp').value=$('#sp').value;doLogin()}).catch(()=>loginErr('Sunucuya ulaşılamadı'))}
function doLogout(){fetch('../api/auth.php?action=logout',{method:'POST',headers:hdrs()}).finally(()=>{localStorage.removeItem('skyturk_sess');SESSION='';ME=null;location.reload()})}
function showApp(){$('#login').style.display='none';$('#layout').style.visibility='visible';$('#whoName').innerHTML=esc(ME.name)+'<br><span class="role-badge">'+(ROLE_TR[ME.role]||ME.role)+'</span>';$('#whoAv').textContent=ME.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();loadServer().finally(route)}
function publish(){
  const payload={news:STATE.news.map(({img,...n})=>n),polls:STATE.polls};
  try{localStorage.setItem('skyturk_news',JSON.stringify(payload.news));localStorage.setItem('skyturk_polls',JSON.stringify(payload.polls));}catch(e){}
  if(!can('news.edit')){toast('Bu işlem için yetkiniz yok');return}
  fetch('../api/data.php',{method:'POST',headers:hdrs(),body:JSON.stringify(payload)}).then(r=>{if(r.status===403)toast('Yetkiniz yok');else if(r.status===401)authInit();else if(!r.ok)toast('Sunucuya yazılamadı');}).catch(()=>toast('Sunucuya ulaşılamadı'));
}
function loadServer(){return fetch('../api/data.php?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.news){STATE.news=d.news.map(n=>{if(!CAT[n.cat])n.cat='genel';if(!n.tags)n.tags=[];n.img=(w,h)=>ph(n.cat,w,h,CAT[n.cat].n);return n});if(d.polls)STATE.polls=d.polls;STATE.updated=d.updated||'';STATE.settings=d.settings||{};}}).catch(()=>{});}

function runFetch(btn){if(!can('rss')){toast('Bu işlem için yetkiniz yok');return}btn.disabled=true;btn.textContent='Çekiliyor…';fetch('../api/fetch.php',{headers:hdrs()}).then(r=>r.json()).then(j=>{toast(j.ok?`${j.added} yeni haber eklendi (toplam ${j.total})`:'Hata: '+(j.error||''));return loadServer()}).catch(()=>toast('Sunucuya ulaşılamadı')).finally(()=>{btn.disabled=false;btn.textContent='⟳ Şimdi çek';route()})}
function trafficBanner(j){const a=j.traffic&&j.traffic.anomaly;let el=$('#trBanner');if(!el){el=document.createElement('div');el.id='trBanner';el.style.cssText='margin-bottom:18px;padding:12px 16px;border-radius:6px;font-weight:600;font-size:14px';document.querySelector('.content').prepend(el)}
  if(a&&a.why&&a.why.length){el.style.background='#FDECEC';el.style.color='#B00020';el.innerHTML='⚠ Şüpheli trafik: '+a.why.join(' · ')+' · engellenen IP: '+(j.traffic.blocked_ips||0)+' · '+new Date(a.t*1000).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}
  else{el.style.background='#E8F5EE';el.style.color='#1B6B3A';el.innerHTML='✓ Trafik normal · son 5 dk '+(a?a.last5:0)+' istek · bot '+(a?a.bot:0)+' · engelli IP '+(j.traffic.blocked_ips||0)+(j.traffic.anomaly_log&&j.traffic.anomaly_log.length?' · son uyarı '+new Date(j.traffic.anomaly_log[0].t).toLocaleString('tr-TR'):'')}}
function saveSettings(){if(!can('settings')){toast('Yönetici yetkisi gerekir');return}const body={siteName:$('#sSite').value,slogan:$('#sSlogan').value,city:$('#sCity').value,heroCount:Math.max(3,Math.min(12,parseInt($('#sHero').value)||6)),desc:$('#sDesc').value};saveSetting(body,'Genel ayarlar kaydedildi').then(ok=>{const s=$('#sSt');if(s&&ok)s.textContent='Kaydedildi · manşet '+SETT().heroCount})}

function creditBanner(j){trafficBanner(j);const c=j.credit;if(!c||!can('settings'))return;let el=$('#crBanner');if(!el){el=document.createElement('div');el.id='crBanner';el.style.cssText='margin-bottom:18px;padding:12px 16px;border-radius:6px;font-weight:600;font-size:14px';document.querySelector('.content').prepend(el)}
  if(c.exhausted){el.style.background='#FDECEC';el.style.color='#B00020';el.innerHTML='⚠ API kredisi bitti — özgünleştirme ve astroloji durdu. Console › Add funds, ardından Ayarlar › Servisler & API › Yüklenen kredi.';return}
  if(!c.balance){el.style.background='#FFF6DD';el.style.color='#7A5200';el.innerHTML='Kredi sayacı kurulmadı — Ayarlar › Servisler & API › "Yüklenen kredi" alanına Console\'daki bakiyeyi girin.';return}
  const h=c.hours_left;const warn=h!==null&&h<=48;el.style.background=warn?(h<=6?'#FDECEC':'#FFF6DD'):'#E8F5EE';el.style.color=warn?(h<=6?'#B00020':'#7A5200'):'#1B6B3A';
  el.innerHTML=(warn?'⚠ ':'✓ ')+'API kredisi: kalan $'+c.remaining+' / $'+c.balance+' · harcama $'+c.rate_per_day+'/gün'+(h!==null?' · tahmini <b>'+(h>=48?Math.round(h/24)+' gün':Math.round(h)+' saat')+'</b> kaldı':' · hız hesaplanıyor');}
function saveSecret(){if(!can('settings')){toast('Bu işlem için yönetici yetkisi gerekir');return}
  const k=$('#akey').value.trim(),m=$('#amodel').value;const body={REWRITE_MODEL:m};if(k)body.ANTHROPIC_KEY=k;const pk=$('#pkey').value.trim();if(pk)body.PEXELS_KEY=pk;
  fetch('../api/data.php?action=secret',{method:'POST',headers:hdrs(),body:JSON.stringify(body)}).then(async r=>{const t=await r.text();let j={};try{j=JSON.parse(t)}catch(e){}
    if(r.status===403){$('#akeyst').textContent='Yetkiniz yok (yönetici gerekir)';toast('Yetkiniz yok');return}
    if(!r.ok||!j.ok){$('#akeyst').textContent='Hata '+r.status+': '+(j.error||t.slice(0,120));toast('Kaydedilemedi');return}
    $('#akeyst').textContent='Kaydedildi · anahtar: '+(j.has_key?'var':'yok')+' · model: '+j.model;toast('Kaydedildi')}).catch(e=>{$('#akeyst').textContent='Sunucuya ulaşılamadı: '+e.message;toast('Sunucuya ulaşılamadı')})}
function generic(t,d){return `<div class="ph"><div><h1>${t}</h1><p>${d}</p></div></div><div class="panel" style="padding:40px;text-align:center;color:var(--ink2)">Bu modül yapılandırma aşamasında. <a href="#/" style="color:var(--navy);font-weight:700">Kontrol paneline dön</a></div>`}

/* Router */
let DIRTY=false;
function route(){
  const raw=location.hash.replace(/^#/,'')||'/';const [path,q]=raw.split('?');const p=path.split('/').filter(Boolean);
  let html='',cur='/'+(p[0]||'');
  switch(p[0]){
    case undefined:html=dashboard();break;
    case 'haberler':html=newsList(q);break;
    case 'haber':html=editor(p[1]||'yeni');cur='/haberler';break;
    case 'kategoriler':html=categories();break;
    case 'etiketler':html=tags();break;
    case 'mansetler':html=mansetler();break;
    case 'ajanslar':html=ajanslar();break;
    case 'yorumlar':html=comments();break;
    case 'medya':html=media();break;
    case 'foto-galeri':html=galleryPage(false);break;
    case 'video':html=galleryPage(true);break;
    case 'roportaj':html=peopleAdmin('roportaj');break;
    case 'biyografi':html=peopleAdmin('biyografi');break;
    case 'anketler':html=pollsAdmin();break;
    case 'ozel-haber':html=ozelAdmin();break;
    case 'resmi-ilan':html=ilanAdmin();break;
    case 'dijital-gazete':html=epaperAdmin();break;
    case 'puan-durumu':html=standingsAdmin();break;
    case 'trafik':html=trafficAdmin();break;
    case 'hava':case 'piyasa':html=serviceAdmin(p[0]);break;
    case 'rehber':html=dirAdmin();break;
    case 'ilan':html=clsAdmin();break;
    case 'icerik':html=galleryPage(false);break;
    case 'servisler':html=standingsAdmin();break;
    case 'uyeler':html=users();break;
    case 'gunluk':html=auditPage();break;
    case 'ayarlar':html=settings(p[1]);break;
    case 'iletisim':html=inbox();break;
    case 'reklamlar':html=generic('Reklamlar','9 aktif reklam alanı · banner ve native yerleşimler.');break;
    case 'sayfalar':html=generic('Sayfalar','Künye, İletişim, Gizlilik, Yayın İlkeleri gibi statik sayfalar.');break;
    case 'gorunum':html=generic('Görünüm','Tema, renk ve tipografi ayarları (SKYTÜRK gök mavisi teması aktif).');break;
    case 'sistem':html=generic('Sistem','Önbellek, yedekleme, günlükler ve sürüm bilgisi.');break;
    default:html=generic('Sayfa bulunamadı','İstenen adres yok.');
  }
  $('#app').innerHTML=html;renderNav(cur);scrollTo(0,0);
}
addEventListener('hashchange',()=>{if(ME)route()});authInit();
</script>
<script>const _editor=editor,_save=save,_route=route,_newsList=newsList,_showAppOrig=showApp;function _showApp(){$('#login').style.display='none';$('#layout').style.visibility='visible';$('#whoName').innerHTML=esc(ME.name)+'<br><span class="role-badge">'+(ROLE_TR[ME.role]||ME.role)+'</span>';$('#whoAv').textContent=ME.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();loadServer().then(()=>{try{applyCats()}catch(e){}}).finally(route)}</script>
<script>
/* ================= SKYTÜRK CMS — İŞLEVSEL KATMAN ================= */
/* Genel modal */
function modal(title,fields,onSave,opts={}){const old=$('#skyModal');if(old)old.remove();const m=document.createElement('div');m.id='skyModal';m.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:90;display:grid;place-items:center;padding:20px';
  m.innerHTML=`<div class="panel" style="width:100%;max-width:${opts.wide?820:560}px;max-height:92vh;overflow:auto;padding:22px"><h3 style="margin-bottom:14px">${esc(title)}</h3>${fields.map(f=>`<div class="field"><label>${esc(f.label)}</label>${f.type==='textarea'?`<textarea id="mf_${f.k}" style="min-height:${f.rows?f.rows*22:110}px">${esc(f.value??'')}</textarea>`:f.type==='select'?`<select id="mf_${f.k}">${f.options.map(o=>`<option value="${esc(o[0])}" ${String(o[0])===String(f.value)?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.type==='check'?`<label class="chk"><input type="checkbox" id="mf_${f.k}" ${f.value?'checked':''}> ${esc(f.hint||'')}</label>`:`<input id="mf_${f.k}" type="${f.type||'text'}" value="${esc(f.value??'')}" placeholder="${esc(f.ph||'')}">`}${f.note?`<small style="color:var(--ink2)">${f.note}</small>`:''}</div>`).join('')}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:6px"><button class="btn btn-s" onclick="$('#skyModal').remove()">İptal</button><button class="btn btn-g" id="mfSave">${esc(opts.saveLabel||'Kaydet')}</button></div></div>`;
  document.body.appendChild(m);$('#mfSave').onclick=()=>{const v={};fields.forEach(f=>{const el=$('#mf_'+f.k);v[f.k]=f.type==='check'?el.checked:el.value});if(onSave(v)!==false)m.remove()};m.addEventListener('click',e=>{if(e.target===m)m.remove()});setTimeout(()=>{const first=m.querySelector('input,textarea,select');if(first)first.focus()},30)}
const SETT=()=>STATE.settings||(STATE.settings={});
function saveSetting(obj,msg){return fetch('../api/data.php?action=settings',{method:'POST',headers:hdrs(),body:JSON.stringify(obj)}).then(async r=>{const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('HTTP '+r.status+' · '+t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,90))}}).then(j=>{if(j.ok){STATE.settings=(j.settings&&!Array.isArray(j.settings))?j.settings:Object.assign(SETT(),obj);toast(msg||'Kaydedildi');return true}toast(j.error||'Hata');return false}).catch(e=>{console.error(e);toast('Kaydedilemedi: '+(e&&e.message||'bağlantı'));return false})}
/* Sunucudan tüm koleksiyonlar */
function loadServer(){return fetch('../api/data.php?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(!d)return;if(d.news){STATE.news=d.news.map(n=>{if(!CAT[n.cat])n.cat='genel';if(!n.tags)n.tags=[];n.img=n.imgUrl?((w,h)=>n.imgUrl):((w,h)=>ph(n.cat,w,h,CAT[n.cat].n));return n})}
  STATE.polls=d.polls||[];STATE.updated=d.updated||'';STATE.settings=d.settings||{};STATE.comments=d.comments||[];STATE.messages=d.messages||[];STATE.dir=d.dir||[];STATE.cls=d.cls||[];STATE.interviews=d.interviews||[];STATE.bios=d.bios||[];STATE.astro=d.astro||null;
  msgs.length=0;STATE.messages.forEach(m=>msgs.push([m.subject,m.email||m.name,m.d,!!m.read]));}).catch(()=>{})}
function publish(){if(!can('news.edit')){toast('Bu işlem için yetkiniz yok');return}
  const payload={news:STATE.news.map(({img,...n})=>n),polls:STATE.polls,comments:STATE.comments||[],messages:STATE.messages||[],dir:STATE.dir||[],cls:STATE.cls||[],interviews:STATE.interviews||[],bios:STATE.bios||[]};
  return fetch('../api/data.php',{method:'POST',headers:hdrs(),body:JSON.stringify(payload)}).then(r=>{if(r.status===403)toast('Yetkiniz yok');else if(r.status===401)authInit();else if(!r.ok)toast('Sunucuya yazılamadı');}).catch(()=>toast('Sunucuya ulaşılamadı'))}
/* CSV dışa aktarma */
function exportCSV(){const rows=[['id','tarih','kategori','baslik','spot','yazar','durum','etiketler','kaynak']].concat(STATE.news.map(n=>[n.id,n.d,CAT[n.cat]?CAT[n.cat].n:n.cat,n.t,n.s||'',n.by||'',n.st,(n.tags||[]).join('|'),n.src||'']));const csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='skyturk-haberler-'+new Date().toISOString().slice(0,10)+'.csv';a.click();toast('CSV indirildi')}
/* ---------- ETİKETLER ---------- */
function tags(){const all={};STATE.news.forEach(n=>(n.tags||[]).forEach(t=>all[t]=(all[t]||0)+1));(SETT().tagsExtra||[]).forEach(t=>{if(!(t in all))all[t]=0});const l=Object.entries(all).sort((a,b)=>b[1]-a[1]);
  return `<div class="ph"><div><h1>Etiketler</h1><p>${l.length} etiket · haberlerdeki etiketlerden türetilir</p></div><button class="btn btn-p" onclick="modal('Yeni etiket',[{k:'t',label:'Etiket',ph:'küçük harf'}],v=>{const t=v.t.trim().toLowerCase();if(!t)return false;const ex=SETT().tagsExtra||[];if(!ex.includes(t))ex.push(t);saveSetting({tagsExtra:ex},'Etiket eklendi').then(route)})">＋ Yeni Etiket</button></div><div class="panel"><table><thead><tr><th>Etiket</th><th>Slug</th><th>Haber</th><th></th></tr></thead><tbody>${l.map(t=>`<tr><td><b>${esc(t[0])}</b></td><td style="color:var(--ink2)">/etiket/${slug(t[0])}</td><td>${t[1]}</td><td><div class="rowact"><button title="Yeniden adlandır" onclick="renameTag('${esc(t[0])}')">✎</button><button class="del" title="Sil" onclick="deleteTag('${esc(t[0])}')">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}
function renameTag(t){modal('Etiketi yeniden adlandır',[{k:'n',label:'Yeni ad',value:t}],v=>{const n=v.n.trim().toLowerCase();if(!n)return false;STATE.news.forEach(x=>{x.tags=(x.tags||[]).map(y=>y===t?n:y)});const ex=(SETT().tagsExtra||[]).map(y=>y===t?n:y);publish();saveSetting({tagsExtra:ex},'Etiket güncellendi').then(route)})}
function deleteTag(t){if(!confirm('"'+t+'" etiketi tüm haberlerden kaldırılsın mı?'))return;STATE.news.forEach(x=>{x.tags=(x.tags||[]).filter(y=>y!==t)});publish();saveSetting({tagsExtra:(SETT().tagsExtra||[]).filter(y=>y!==t)},'Etiket silindi').then(route)}
/* ---------- MANŞETLER ---------- */
function heroIds(){return (SETT().hero||[]).filter(id=>STATE.news.some(n=>n.id===id))}
function mansetler(){const ids=heroIds();const l=ids.map(id=>STATE.news.find(n=>n.id===id));const auto=[...STATE.news].filter(n=>!n.video&&n.st==='Yayında'&&!ids.includes(n.id)).sort((a,b)=>pd(b.d)-pd(a.d)).slice(0,Math.max(0,(SETT().heroCount||6)-ids.length));
  return `<div class="ph"><div><h1>Manşetler</h1><p>Sabitlenen ${ids.length} haber önce gösterilir; kalan ${auto.length} slot en yeni haberlerle otomatik dolar (toplam ${SETT().heroCount||6}, Ayarlar › Genel).</p></div><button class="btn btn-p" onclick="pickHero()">＋ Manşete ekle</button></div>
  <div class="panel"><table><thead><tr><th>Sıra</th><th>Görsel</th><th>Başlık</th><th>Kategori</th><th>Tür</th><th></th></tr></thead><tbody>${l.map((n,i)=>`<tr><td><b class="fh" style="font-size:20px;color:var(--sky)">${i+1}</b></td><td class="th"><img src="${n.img(128,88)}" alt=""></td><td class="title">${esc(n.t)}</td><td style="color:var(--ink2)">${CAT[n.cat].n}</td><td><span class="st" style="background:var(--gold);color:#222">Sabit</span></td><td><div class="rowact" style="opacity:1"><button title="Yukarı" onclick="heroMove(${n.id},-1)">↑</button><button title="Aşağı" onclick="heroMove(${n.id},1)">↓</button><button class="del" title="Kaldır" onclick="heroSet(heroIds().filter(x=>x!==${n.id}))">✕</button></div></td></tr>`).join('')}${auto.map((n,i)=>`<tr style="opacity:.75"><td><b class="fh" style="font-size:20px;color:var(--ink2)">${ids.length+i+1}</b></td><td class="th"><img src="${n.img(128,88)}" alt=""></td><td class="title">${esc(n.t)}</td><td style="color:var(--ink2)">${CAT[n.cat].n}</td><td><span class="st arc">Otomatik</span></td><td><div class="rowact" style="opacity:1"><button title="Sabitle" onclick="heroSet([...heroIds(),${n.id}])">★</button></div></td></tr>`).join('')}</tbody></table></div>`}
function heroSet(ids){saveSetting({hero:ids.slice(0,12)},'Manşetler güncellendi').then(route)}
function heroMove(id,dir){const ids=heroIds();const i=ids.indexOf(id);const j=i+dir;if(i<0||j<0||j>=ids.length)return;[ids[i],ids[j]]=[ids[j],ids[i]];heroSet(ids)}
function pickHero(){const cands=[...STATE.news].filter(n=>!n.video&&n.st==='Yayında').sort((a,b)=>pd(b.d)-pd(a.d)).slice(0,60);modal('Manşete haber ekle',[{k:'id',label:'Haber',type:'select',options:cands.map(n=>[n.id,n.t.slice(0,90)])}],v=>{heroSet([...heroIds(),parseInt(v.id)])})}
/* ---------- KATEGORİLER ---------- */
function categories(){const over=SETT().cats||{};return `<div class="ph"><div><h1>Kategoriler</h1><p>${CATS.length} kategori · ad ve renk düzenlenebilir</p></div><button class="btn btn-p" onclick="modal('Yeni kategori',[{k:'id',label:'Kimlik (slug)',ph:'ornek-kategori'},{k:'n',label:'Ad'},{k:'c',label:'Renk',type:'color',value:'#0B4F9E'}],v=>{const id=slug(v.id||v.n);if(!id||CAT[id])return toast('Geçersiz/var olan kimlik'),false;const o=SETT().cats||{};o[id]={n:v.n,c:v.c,custom:true};saveSetting({cats:o},'Kategori eklendi').then(()=>{applyCats();route()})})">＋ Yeni Kategori</button></div>
  <div class="cards">${CATS.map(c=>{const k=STATE.news.filter(n=>n.cat===c.id).length;return `<div class="panel ccard"><div class="hd"><i style="background:${c.c}"></i><b>${esc(c.n)}</b><small>${k} haber</small></div><p>/${c.id}${over[c.id]&&over[c.id].custom?' · özel':''}</p><div class="ft"><button onclick="editCat('${c.id}')">Düzenle</button><a href="#/haberler?cat=${c.id}" style="font-size:13px;font-weight:700;color:var(--ink2)">Haberleri gör</a>${over[c.id]&&over[c.id].custom?`<button style="color:var(--red)" onclick="delCat('${c.id}')">Sil</button>`:''}</div></div>`}).join('')}</div>`}
function editCat(id){const c=CAT[id];modal('Kategori düzenle',[{k:'n',label:'Ad',value:c.n},{k:'c',label:'Renk',type:'color',value:c.c}],v=>{const o=SETT().cats||{};o[id]=Object.assign(o[id]||{},{n:v.n,c:v.c});saveSetting({cats:o},'Kategori güncellendi').then(()=>{applyCats();route()})})}
function delCat(id){if(!confirm('Kategori silinsin mi? Haberleri "Genel"e taşınır.'))return;STATE.news.forEach(n=>{if(n.cat===id)n.cat='genel'});publish();const o=SETT().cats||{};delete o[id];saveSetting({cats:o},'Kategori silindi').then(()=>{applyCats();route()})}
function applyCats(){const o=SETT().cats||{};Object.entries(o).forEach(([id,v])=>{if(CAT[id]){CAT[id].n=v.n||CAT[id].n;CAT[id].c=v.c||CAT[id].c}else if(v.custom){const c={id,n:v.n,c:v.c};CATS.push(c);CAT[id]=c}})}
/* ---------- AJANSLAR (RSS kaynak yönetimi) ---------- */
function feedList(){return SETT().feeds||FEEDS_DEFAULT}
const FEEDS_DEFAULT=[['https://www.ntv.com.tr/son-dakika.rss','son-dakika','NTV'],['https://www.ntv.com.tr/gundem.rss','gundem','NTV'],['https://www.ntv.com.tr/turkiye.rss','genel','NTV'],['https://www.ntv.com.tr/dunya.rss','dunya','NTV'],['https://www.ntv.com.tr/ekonomi.rss','ekonomi','NTV'],['https://www.ntv.com.tr/teknoloji.rss','teknoloji','NTV'],['https://www.ntv.com.tr/yasam.rss','yasam','NTV'],['https://www.ntv.com.tr/saglik.rss','saglik','NTV'],['https://www.ntv.com.tr/egitim.rss','egitim','NTV'],['https://www.aa.com.tr/tr/rss/default?cat=guncel','gundem','AA'],['https://www.aa.com.tr/tr/rss/default?cat=politika','politika','AA'],['https://www.aa.com.tr/tr/rss/default?cat=dunya','dunya','AA'],['https://www.aa.com.tr/tr/rss/default?cat=ekonomi','ekonomi','AA'],['https://www.aa.com.tr/tr/rss/default?cat=spor','spor','AA'],['https://www.aa.com.tr/tr/rss/default?cat=bilim-teknoloji','teknoloji','AA'],['https://www.aa.com.tr/tr/rss/default?cat=saglik','saglik','AA'],['https://www.aa.com.tr/tr/rss/default?cat=egitim','egitim','AA'],['https://www.aa.com.tr/tr/rss/default?cat=yasam','yasam','AA'],['https://www.aa.com.tr/tr/teyithatti/rss/news?cat=0','gundem','AA Teyit Hattı'],['https://www.trthaber.com/sondakika_articles.rss','son-dakika','TRT Haber'],['https://www.trthaber.com/manset_articles.rss','gundem','TRT Haber'],['https://www.trthaber.com/spor_articles.rss','spor','TRT Haber'],['https://www.trthaber.com/ekonomi_articles.rss','ekonomi','TRT Haber'],['https://www.trthaber.com/kultur_sanat_articles.rss','kultur-sanat','TRT Haber'],['https://www.hurriyet.com.tr/rss/anasayfa','gundem','Hürriyet'],['https://www.hurriyet.com.tr/rss/spor','spor','Hürriyet'],['https://www.hurriyet.com.tr/rss/ekonomi','ekonomi','Hürriyet'],['https://www.hurriyet.com.tr/rss/dunya','dunya','Hürriyet'],['https://www.cumhuriyet.com.tr/rss/son_dakika.xml','son-dakika','Cumhuriyet']].map(f=>({url:f[0],cat:f[1],name:f[2]}));
function ajanslar(){const auto=STATE.news.filter(n=>n.auto);const feeds=feedList();
  return `<div class="ph"><div><h1>Ajanslar / RSS</h1><p>${auto.length} otomatik haber · ${auto.filter(n=>n.rw).length} özgünleştirilmiş · son çekim: ${STATE.updated?new Date(STATE.updated).toLocaleString('tr-TR'):'—'} · cron her 15 dk</p></div><div style="display:flex;gap:8px"><button class="btn btn-s" onclick="modal('Kaynak ekle',[{k:'name',label:'Kaynak adı',ph:'Örn. Sözcü'},{k:'url',label:'RSS adresi',ph:'https://…'},{k:'cat',label:'Kategori',type:'select',options:CATS.map(c=>[c.id,c.n])}],v=>{if(!/^https?:\\/\\//.test(v.url))return toast('Geçerli adres girin'),false;const f=feedList().concat([{url:v.url.trim(),cat:v.cat,name:v.name.trim()||'Kaynak'}]);saveSetting({feeds:f},'Kaynak eklendi').then(route)})">＋ Kaynak ekle</button><button class="btn btn-p" onclick="runFetch(this)">⟳ Şimdi çek</button></div></div>
  <div class="panel"><div class="wh"><div><h3>Kaynaklar</h3><small>Her kaynaktan tur başına en fazla 3 yeni haber alınır</small></div></div><table><thead><tr><th>Kaynak</th><th>RSS</th><th>Kategori</th><th>Çekilen</th><th></th></tr></thead><tbody>${feeds.map((f,i)=>`<tr><td><b>${esc(f.name)}</b></td><td style="color:var(--ink2);font-size:12px;max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.url)}</td><td style="color:var(--ink2)">${CAT[f.cat]?CAT[f.cat].n:f.cat}</td><td>${auto.filter(n=>(n.srcName||n.by)===f.name&&n.cat===f.cat).length}</td><td><div class="rowact"><button title="Düzenle" onclick="editFeed(${i})">✎</button><button class="del" title="Sil" onclick="if(confirm('Kaynak kaldırılsın mı?')){const f=feedList().slice();f.splice(${i},1);saveSetting({feeds:f},'Kaynak kaldırıldı').then(route)}">✕</button></div></td></tr>`).join('')}</tbody></table></div>
  <div class="panel tbl-wrap"><div class="wh"><h3>Son çekilen haberler</h3></div><div style="overflow:auto"><table><thead><tr><th>ID</th><th>Görsel</th><th>Başlık</th><th>Kategoriler</th><th>Oluşturan</th><th>Tıklanma</th><th>Durum</th><th>Oluşturma</th><th></th></tr></thead><tbody>${auto.slice(0,30).map(row).join('')}</tbody></table></div></div>`}
function editFeed(i){const f=feedList()[i];modal('Kaynağı düzenle',[{k:'name',label:'Kaynak adı',value:f.name},{k:'url',label:'RSS adresi',value:f.url},{k:'cat',label:'Kategori',type:'select',value:f.cat,options:CATS.map(c=>[c.id,c.n])}],v=>{const l=feedList().slice();l[i]={url:v.url.trim(),cat:v.cat,name:v.name.trim()};saveSetting({feeds:l},'Kaynak güncellendi').then(route)})}
/* ---------- VİDEO / FOTO GALERİ ---------- */
function galleryPage(video){const l=STATE.news.filter(n=>video?n.video:(n.imgUrl&&!n.video)).sort((a,b)=>pd(b.d)-pd(a.d)).slice(0,60);
  return `<div class="ph"><div><h1>${video?'Video Galeri':'Foto Galeri'}</h1><p>${l.length} ${video?'video':'görselli haber'}</p></div>${video?`<button class="btn btn-p" onclick="addVideo()">＋ YouTube videosu ekle</button>`:`<a class="btn btn-p" href="#/haber/yeni">＋ Görselli haber</a>`}</div><div class="panel"><table><thead><tr><th>ID</th><th>Kapak</th><th>Başlık</th><th>Kategori</th><th>Kaynak</th><th>Durum</th><th></th></tr></thead><tbody>${l.map(n=>`<tr><td>${n.id}</td><td class="th"><img src="${n.img(128,88)}" alt=""></td><td class="title"><a href="#/haber/${n.id}">${esc(n.t)}</a></td><td style="color:var(--ink2)">${CAT[n.cat].n}</td><td style="color:var(--ink2)">${esc(n.srcName||n.by||'')}</td><td><span class="st ${stCls(n.st)}">${n.st}</span></td><td><div class="rowact"><button onclick="location.hash='#/haber/${n.id}'">✎</button><button class="del" onclick="del(${n.id})">✕</button></div></td></tr>`).join('')||'<tr><td colspan="7" style="padding:24px;color:var(--ink2)">Kayıt yok</td></tr>'}</tbody></table></div>`}
function addVideo(){modal('YouTube videosu ekle',[{k:'url',label:'YouTube adresi',ph:'https://www.youtube.com/watch?v=…'},{k:'t',label:'Başlık'},{k:'s',label:'Açıklama',type:'textarea',rows:3},{k:'cat',label:'Kategori',type:'select',options:CATS.map(c=>[c.id,c.n])}],v=>{const m=(v.url||'').match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);if(!m)return toast('YouTube adresi tanınmadı'),false;const id=m[1];const n={id:Math.max(5000,...STATE.news.filter(x=>!x.auto).map(x=>x.id))+1,cat:v.cat,t:v.t.trim()||'Video',s:v.s.trim(),d:new Date().toLocaleDateString('tr-TR')+' '+new Date().toTimeString().slice(0,5),by:ME.name,v:0,st:'Yayında',tags:['video'],video:true,ytId:id,imgUrl:'https://i.ytimg.com/vi/'+id+'/hqdefault.jpg',imgCredit:'Görsel: YouTube',imgLink:v.url,rw:true,p:[v.s.trim()]};n.img=(w,h)=>n.imgUrl;STATE.news.unshift(n);publish().then(()=>{toast('Video eklendi');route()})})}
/* ---------- RÖPORTAJ / BİYOGRAFİ ---------- */
function peopleAdmin(kind){const L=kind==='roportaj'?(STATE.interviews||[]):(STATE.bios||[]);const label=kind==='roportaj'?'Röportaj':'Biyografi';
  return `<div class="ph"><div><h1>${label}</h1><p>${L.length} kayıt · sitede ${label} bölümünde görünür</p></div><button class="btn btn-p" onclick="editPerson('${kind}',null)">＋ Yeni ${label}</button></div><div class="panel"><table><thead><tr><th>Kişi</th><th>Unvan</th><th>${kind==='roportaj'?'Başlık':'Özet'}</th><th>Kategori</th><th></th></tr></thead><tbody>${L.length?'':'<tr><td colspan="5" style="color:var(--ink2);text-align:center;padding:30px">Henüz kayıt yok.</td></tr>'}${L.map((p,i)=>`<tr class="userrow"><td><div style="display:flex;gap:10px;align-items:center"><span class="av" style="background:${CAT[p.cat]?CAT[p.cat].c:'#0B4F9E'}">${esc(p.n.replace(/^(Prof\. |Dr\. )+/,'').split(' ').map(x=>x[0]).join('').slice(0,2))}</span><b>${esc(p.n)}</b></div></td><td style="color:var(--ink2)">${esc(p.role||'')}</td><td class="title">${esc(p.t||p.s||'')}</td><td style="color:var(--ink2)">${CAT[p.cat]?CAT[p.cat].n:''}</td><td><div class="rowact"><button onclick="editPerson('${kind}',${i})">✎</button><button class="del" onclick="if(confirm('Silinsin mi?')){(${kind==='roportaj'?'STATE.interviews':'STATE.bios'}).splice(${i},1);publish().then(route)}">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editPerson(kind,i){const arr=kind==='roportaj'?(STATE.interviews||(STATE.interviews=[])):(STATE.bios||(STATE.bios=[]));const p=i===null?{}:arr[i];modal((i===null?'Yeni ':'Düzenle: ')+(kind==='roportaj'?'Röportaj':'Biyografi'),[{k:'n',label:'Ad Soyad',value:p.n},{k:'role',label:'Unvan / Görev',value:p.role},{k:'t',label:kind==='roportaj'?'Başlık (tırnak içinde çarpıcı cümle)':'Kısa başlık',value:p.t},{k:'s',label:'Özet',type:'textarea',rows:3,value:p.s},{k:'body',label:'Metin (paragraflar boş satırla)',type:'textarea',rows:8,value:(p.body||[]).join('\n\n')},{k:'cat',label:'Kategori',type:'select',value:p.cat||'gundem',options:CATS.map(c=>[c.id,c.n])},{k:'imgUrl',label:'Görsel adresi (isteğe bağlı)',value:p.imgUrl,note:'Medya kütüphanesinden kopyalayabilirsiniz'}],v=>{if(!v.n.trim())return false;const o={id:p.id||('p'+Date.now()),n:v.n.trim(),role:v.role.trim(),t:v.t.trim(),s:v.s.trim(),body:v.body.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),cat:v.cat,imgUrl:v.imgUrl.trim(),d:p.d||new Date().toLocaleDateString('tr-TR')};if(i===null)arr.unshift(o);else arr[i]=o;publish().then(route)},{wide:true})}
/* ---------- ANKETLER ---------- */
function pollsAdmin(){return `<div class="ph"><div><h1>Anketler</h1><p>${STATE.polls.filter(p=>p.open).length} açık · ${STATE.polls.filter(p=>!p.open).length} kapalı · ilk açık anket anasayfada</p></div><button class="btn btn-p" onclick="editPoll(null)">＋ Yeni Anket</button></div><div class="cards">${STATE.polls.map((p,i)=>`<div class="panel ccard"><div class="hd"><i style="background:${p.open?'var(--green)':'var(--ink2)'}"></i><b style="font-size:15px;line-height:1.3">${esc(p.q)}</b></div>${p.o.map(o=>{const tot=p.o.reduce((a,x)=>a+(+x[1]||0),0)||1;const pct=Math.round((+o[1]||0)*100/tot);return `<div style="font-size:13px"><div style="display:flex;justify-content:space-between"><span>${esc(o[0])}</span><b>${pct}% (${o[1]||0})</b></div><div style="height:6px;background:#EEF2F7;border-radius:3px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;background:var(--sky)"></i></div></div>`}).join('')}<p>${fmt(p.votes||0)} oy · ${p.open?'Açık':'Kapalı'}</p><div class="ft"><button onclick="togglePoll('${p.id}')">${p.open?'Kapat':'Aç'}</button><button onclick="editPoll(${i})">Düzenle</button><button style="color:var(--red)" onclick="if(confirm('Anket silinsin mi?')){STATE.polls.splice(${i},1);publish().then(route)}">Sil</button></div></div>`).join('')||'<div class="panel" style="padding:30px;color:var(--ink2)">Henüz anket yok.</div>'}</div>`}
function editPoll(i){const p=i===null?{q:'',o:[]}:STATE.polls[i];modal(i===null?'Yeni anket':'Anketi düzenle',[{k:'q',label:'Soru',value:p.q},{k:'o',label:'Seçenekler (her satıra bir)',type:'textarea',rows:5,value:p.o.map(x=>x[0]).join('\n')},{k:'open',label:'Durum',type:'check',hint:'Anket açık',value:i===null?true:!!p.open}],v=>{const opts=v.o.split('\n').map(x=>x.trim()).filter(Boolean);if(!v.q.trim()||opts.length<2)return toast('Soru ve en az 2 seçenek'),false;const o=opts.map(t=>{const ex=p.o.find(x=>x[0]===t);return [t,ex?ex[1]:0]});const np={id:p.id||('p'+Date.now()),q:v.q.trim(),o,votes:o.reduce((a,x)=>a+(+x[1]||0),0),open:v.open};if(i===null)STATE.polls.unshift(np);else STATE.polls[i]=np;publish().then(route)})}
/* ---------- FİRMA REHBERİ / SERİ İLAN ---------- */
function dirAdmin(){const L=STATE.dir||[];return `<div class="ph"><div><h1>Firma Rehberi</h1><p>${L.length} firma</p></div><button class="btn btn-p" onclick="editDir(null)">＋ Firma ekle</button></div><div class="panel"><table><thead><tr><th>Firma</th><th>Kategori</th><th>Semt</th><th>Telefon</th><th>Paket</th><th>Durum</th><th></th></tr></thead><tbody>${L.length?'':'<tr><td colspan="7" style="color:var(--ink2);text-align:center;padding:30px">Henüz firma yok.</td></tr>'}${L.map((d,i)=>`<tr><td><b>${esc(d.n)}</b></td><td style="color:var(--ink2)">${esc(d.c)}</td><td style="color:var(--ink2)">${esc(d.l)}</td><td style="color:var(--ink2)">${esc(d.tel||'')}</td><td><span class="role">${d.featured?'Öne çıkan':'Standart'}</span></td><td><span class="st ${d.ok?'':'draft'}">${d.ok?'Aktif':'Pasif'}</span></td><td><div class="rowact"><button onclick="editDir(${i})">✎</button><button class="del" onclick="if(confirm('Silinsin mi?')){STATE.dir.splice(${i},1);publish().then(route)}">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editDir(i){const d=i===null?{ok:true}:STATE.dir[i];modal(i===null?'Firma ekle':'Firmayı düzenle',[{k:'n',label:'Firma adı',value:d.n},{k:'c',label:'Kategori',value:d.c,ph:'Sağlık, Hukuk, Gıda…'},{k:'l',label:'Semt / İlçe',value:d.l},{k:'tel',label:'Telefon',value:d.tel},{k:'web',label:'Web / harita adresi',value:d.web},{k:'desc',label:'Açıklama',type:'textarea',rows:3,value:d.desc},{k:'featured',label:'Paket',type:'check',hint:'Öne çıkan',value:!!d.featured},{k:'ok',label:'Durum',type:'check',hint:'Aktif (sitede görünür)',value:d.ok!==false}],v=>{if(!v.n.trim())return false;const o={n:v.n.trim(),c:v.c.trim(),l:v.l.trim(),tel:v.tel.trim(),web:v.web.trim(),desc:v.desc.trim(),featured:v.featured,ok:v.ok};STATE.dir=STATE.dir||[];if(i===null)STATE.dir.unshift(o);else STATE.dir[i]=o;publish().then(route)})}
function clsAdmin(){const L=STATE.cls||[];return `<div class="ph"><div><h1>Seri İlan</h1><p>${L.filter(c=>!c.ok).length} onay bekliyor · ${L.filter(c=>c.ok).length} yayında</p></div><button class="btn btn-p" onclick="editCls(null)">＋ İlan ekle</button></div><div class="panel"><table><thead><tr><th>İlan</th><th>Kategori</th><th>Fiyat</th><th>İletişim</th><th>Durum</th><th></th></tr></thead><tbody>${L.length?'':'<tr><td colspan="6" style="color:var(--ink2);text-align:center;padding:30px">Henüz ilan yok.</td></tr>'}${L.map((c,i)=>`<tr class="${c.ok?'':'draft'}"><td><b>${esc(c.t)}</b><br><small style="color:var(--ink2)">${esc((c.desc||'').slice(0,80))}</small></td><td style="color:var(--ink2)">${esc(c.c)}</td><td>${esc(c.p)}</td><td style="color:var(--ink2)">${esc(c.tel||'')}</td><td><span class="st ${c.ok?'':'pending'}">${c.ok?'Yayında':'Bekliyor'}</span></td><td><div class="acts" style="display:flex;gap:6px">${c.ok?'':`<button class="mini ok" onclick="STATE.cls[${i}].ok=true;publish().then(()=>{toast('İlan onaylandı');route()})">Onayla</button>`}<button class="mini" onclick="editCls(${i})">Düzenle</button><button class="mini" onclick="if(confirm('Silinsin mi?')){STATE.cls.splice(${i},1);publish().then(route)}">Sil</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editCls(i){const c=i===null?{ok:true}:STATE.cls[i];modal(i===null?'İlan ekle':'İlanı düzenle',[{k:'t',label:'Başlık',value:c.t},{k:'c',label:'Kategori',type:'select',value:c.c||'Emlak',options:['Emlak','Vasıta','İş','Eğitim','Hizmet','Ticari','Diğer'].map(x=>[x,x])},{k:'p',label:'Fiyat',value:c.p,ph:'45.000 ₺ / Görüşülür'},{k:'tel',label:'İletişim',value:c.tel},{k:'desc',label:'Açıklama',type:'textarea',rows:4,value:c.desc},{k:'ok',label:'Durum',type:'check',hint:'Yayında',value:c.ok!==false}],v=>{if(!v.t.trim())return false;const o={t:v.t.trim(),c:v.c,p:v.p.trim(),tel:v.tel.trim(),desc:v.desc.trim(),ok:v.ok,d:c.d||new Date().toLocaleDateString('tr-TR')};STATE.cls=STATE.cls||[];if(i===null)STATE.cls.unshift(o);else STATE.cls[i]=o;publish().then(route)})}
/* ---------- YORUMLAR (sunucu) ---------- */
function comments(){const L=STATE.comments||[];return `<div class="ph"><div><h1>Yorumlar</h1><p>${L.filter(c=>c.st==='pending').length} onay bekliyor · ${L.filter(c=>c.st==='ok').length} onaylı · ${L.filter(c=>c.st==='spam').length} spam</p></div><button class="btn btn-s" onclick="STATE.comments=STATE.comments.filter(c=>c.st!=='spam');publish().then(()=>{toast('Spam temizlendi');route()})">Spam klasörünü boşalt</button></div>
  <div class="panel">${L.length?'':'<p style="padding:30px;text-align:center;color:var(--ink2)">Henüz yorum yok. Ziyaretçi yorumları haber sayfalarından gelir ve burada onaylanır.</p>'}${L.map(c=>{const n=STATE.news.find(x=>x.id===c.on);return `<div class="cmt"><span class="av" style="background:${fxc(c.u)}">${esc(c.u.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase())}</span><div><b>${esc(c.u)}</b><small>${esc(c.d)}</small> <span class="st ${c.st==='pending'?'pending':c.st==='spam'?'draft':''}">${{pending:'Bekliyor',ok:'Onaylı',spam:'Spam'}[c.st]}</span><p>${esc(c.t)}</p><div class="on">Haber: <a href="#/haber/${c.on}">${n?esc(n.t):'—'}</a></div></div><div class="acts">${c.st!=='ok'?`<button class="mini ok" onclick="cst(${c.id},'ok')">Onayla</button>`:''}${c.st!=='spam'?`<button class="mini no" onclick="cst(${c.id},'spam')">Spam</button>`:''}<button class="mini" onclick="STATE.comments=STATE.comments.filter(x=>x.id!==${c.id});publish().then(()=>{toast('Yorum silindi');route()})">Sil</button></div></div>`}).join('')}</div>`}
function fxc(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return `hsl(${h} 55% 40%)`}
function cst(id,st){if(!can('comments')){toast('Yorum yetkiniz yok');return}const c=STATE.comments.find(x=>x.id===id);if(c)c.st=st;publish().then(()=>{toast(st==='ok'?'Yorum onaylandı':'Spam olarak işaretlendi');route()})}
/* ---------- İLETİŞİM (sunucu mesajları) ---------- */
function inbox(){const L=STATE.messages||[];return `<div class="ph"><div><h1>İletişim</h1><p>${L.filter(m=>!m.read).length} okunmamış ileti · siteden gelen formlar</p></div></div><div class="panel"><table><thead><tr><th></th><th>Konu</th><th>Gönderen</th><th>Tarih</th><th></th></tr></thead><tbody>${L.length?'':'<tr><td colspan="5" style="padding:30px;text-align:center;color:var(--ink2)">Henüz ileti yok.</td></tr>'}${L.map((m,i)=>`<tr style="${m.read?'':'font-weight:700'}"><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${m.read?'transparent':'var(--sky)'}"></span></td><td><a href="#" onclick="readMsg(${i});return false">${esc(m.subject)}</a></td><td style="color:var(--ink2);font-weight:400">${esc(m.name)}${m.email?' · '+esc(m.email):''}</td><td style="color:var(--ink2);font-weight:400">${esc(m.d)}</td><td><div class="rowact"><button onclick="readMsg(${i})">👁</button><button class="del" onclick="if(confirm('Silinsin mi?')){STATE.messages.splice(${i},1);publish().then(route)}">✕</button></div></td></tr>`).join('')}</tbody></table></div>`}
function readMsg(i){const m=STATE.messages[i];m.read=true;publish();modal(m.subject,[{k:'a',label:'Gönderen',value:m.name+(m.email?' <'+m.email+'>':'')},{k:'b',label:'Mesaj',type:'textarea',rows:8,value:m.message}],()=>{},{saveLabel:'Kapat'});if(m.email){const b=$('#mfSave');b.textContent='E-posta ile yanıtla';b.onclick=()=>{location.href='mailto:'+m.email+'?subject='+encodeURIComponent('Yanıt: '+m.subject);$('#skyModal').remove()}}route()}
/* ---------- MEDYA ---------- */
function media(){setTimeout(loadMedia,30);return `<div class="ph"><div><h1>Medya</h1><p id="mediaSub">Yükleniyor…</p></div><div style="display:flex;gap:8px;align-items:center"><input type="file" id="mediaFile" accept="image/*,.pdf,.mp4" multiple style="display:none" onchange="uploadMedia(this.files)"><button class="btn btn-p" onclick="$('#mediaFile').click()">⤒ Dosya yükle</button></div></div><div class="panel"><div class="toolbar"><input id="mediaQ" placeholder="Dosya adı ara…" oninput="renderMedia()"><span class="sp"></span><span style="font-size:13px;color:var(--ink2)">JPG/PNG/WEBP/GIF/PDF/MP4 · en fazla 15 MB · görseller 1600px'e küçültülür</span></div><div class="media" id="mediaGrid"></div></div>`}
let MEDIA=[];function loadMedia(){fetch('../api/media.php?action=list',{headers:hdrs()}).then(r=>r.json()).then(j=>{MEDIA=j.files||[];const s=$('#mediaSub');if(s)s.textContent=MEDIA.length+' dosya · '+(j.used_mb||0)+' MB';renderMedia()}).catch(()=>{})}
function renderMedia(){const g=$('#mediaGrid');if(!g)return;const q=($('#mediaQ')?.value||'').toLowerCase();g.innerHTML=MEDIA.filter(f=>f.name.toLowerCase().includes(q)).map(f=>`<div class="m">${/\.(jpe?g|png|gif|webp)$/i.test(f.name)?`<img src="../${f.url}" alt="" loading="lazy">`:`<div style="aspect-ratio:4/3;display:grid;place-items:center;background:#F3F4F6;font-size:28px">📄</div>`}<span title="${esc(f.name)}">${esc(f.name)}</span><div style="display:flex;gap:4px;padding:0 6px 6px"><button class="mini" style="flex:1" onclick="navigator.clipboard.writeText('${esc(f.url)}');toast('Adres kopyalandı')">URL</button><button class="mini no" onclick="delMedia('${esc(f.name)}')">Sil</button></div></div>`).join('')||'<p style="padding:20px;color:var(--ink2)">Dosya yok.</p>'}
function uploadMedia(files){[...files].forEach(f=>{const fd=new FormData();fd.append('file',f);fetch('../api/media.php?action=upload',{method:'POST',headers:SESSION?{'X-Session':SESSION}:{},body:fd}).then(r=>r.json()).then(j=>{toast(j.ok?'Yüklendi: '+j.name:(j.error||'Hata'));loadMedia()}).catch(()=>toast('Yükleme başarısız'))})}
function delMedia(n){if(!confirm(n+' silinsin mi?'))return;fetch('../api/media.php?action=delete',{method:'POST',headers:hdrs(),body:JSON.stringify({name:n})}).then(r=>r.json()).then(j=>{toast(j.ok?'Silindi':'Hata');loadMedia()})}
/* ---------- SERVİSLER: hava, piyasa, puan durumu, trafik ---------- */
function serviceAdmin(k){const S=SETT();if(k==='hava'){const w=S.weather||{};return `<div class="ph"><div><h1>Hava Durumu</h1><p>Sitede yan sütunda ve gazetede gösterilir · elle güncellenir</p></div><button class="btn btn-g" onclick="saveSetting({weather:{city:$('#wCity').value,temp:parseInt($('#wTemp').value)||0,desc:$('#wDesc').value,days:[0,1,2,3].map(i=>[$('#wd'+i).value,parseInt($('#wt'+i).value)||0,$('#wx'+i).value])}},'Hava durumu kaydedildi')">Kaydet</button></div><div class="panel" style="padding:22px"><div class="g2"><div class="field"><label>Şehir</label><input id="wCity" value="${esc(w.city||'İstanbul')}"></div><div class="field"><label>Sıcaklık (°C)</label><input id="wTemp" type="number" value="${w.temp??24}"></div></div><div class="field"><label>Durum</label><input id="wDesc" value="${esc(w.desc||'Parçalı Bulutlu')}"></div><h4 style="margin:10px 0">4 günlük tahmin</h4>${[0,1,2,3].map(i=>{const d=(w.days||[['Pzt',23,'Sağanak'],['Sal',22,'Yağmurlu'],['Çrş',25,'Az Bulutlu'],['Prş',26,'Güneşli']])[i];return `<div class="g2" style="grid-template-columns:1fr 1fr 2fr"><div class="field"><label>Gün</label><input id="wd${i}" value="${esc(d[0])}"></div><div class="field"><label>°C</label><input id="wt${i}" type="number" value="${d[1]}"></div><div class="field"><label>Durum</label><input id="wx${i}" value="${esc(d[2])}"></div></div>`}).join('')}</div>`}

  return generic('Servis','—')}

/* ---------- EDİTÖR: görsel adresi alanı ---------- */
function editor(id){const nn=id==='yeni'?null:STATE.news.find(x=>x.id==id);if(nn&&(!nn.p||!nn.p.length))nn.p=[nn.s||'','',''];let h=_editor(id);const cur=nn?nn.by:'Ali Vurdumduymaz';const names=['Ali Vurdumduymaz',...authorsList().map(a=>a.n)];if(!names.includes(cur))names.push(cur);h=h.replace(/<input id="fBy"[^>]*>/,'<select id="fBy">'+names.map(x=>`<option ${x===cur?'selected':''}>${esc(x)}</option>`).join('')+'</select>');const n=id==='yeni'?null:STATE.news.find(x=>x.id==id);h=h.replace('<div class="drop">','<div class="field"><label>Öne çıkan görsel adresi</label><input id="fImg" value="'+esc(n&&n.imgUrl||'')+'" placeholder="media/… veya https://"><small style="color:var(--ink2)"><a href="#/medya" style="color:var(--navy)">Medya</a> sayfasından yükleyip URL kopyalayın</small></div><div class="drop">');return h}
function save(id,st){const img=$('#fImg')?$('#fImg').value.trim():'';if(id!=='yeni'){const n=STATE.news.find(x=>x.id==id);if(n){n.imgUrl=img||n.imgUrl;if(img){n.imgCredit=n.imgCredit||'Fotoğraf: SKYTÜRK';n.img=(w,h)=>n.imgUrl}}}else if(img){setTimeout(()=>{const n=STATE.news[0];if(n){n.imgUrl=img;n.imgCredit='Fotoğraf: SKYTÜRK';n.img=(w,h)=>n.imgUrl;publish()}},50)}return _save(id,st)}
/* ---------- rotalar ---------- */
function route(){const raw=location.hash.replace(/^#/,'')||'/';const [path,q]=raw.split('?');const p=path.split('/').filter(Boolean);const map={yazarlar:authorsAdmin,reklamlar:adsAdmin,sayfalar:pagesAdmin,gorunum:gorunum,sistem:sistem};if(map[p[0]]){if(!can(p[0]==='yazarlar'?'news.edit':'settings')){$('#app').innerHTML='<div class="panel" style="padding:40px;text-align:center;color:var(--ink2)">Bu sayfa için yönetici yetkisi gerekir.</div>';renderNav('/'+p[0]);return}$('#app').innerHTML=map[p[0]]();renderNav('/'+p[0]);scrollTo(0,0);return}return _route()}
NAVI.splice(NAVI.findIndex(n=>n.h==='/sayfalar')+1,0,{h:'/reklamlar',t:'Reklamlar',ic:'▭'});(function(){const hb=NAVI.find(n=>n.h==='/haberler');if(hb&&!hb.sub.some(s=>s[0]==='/yazarlar'))hb.sub.splice(2,0,['/yazarlar','Yazarlar','#3F51B5']);})();
function showApp(){_showApp();setInterval(()=>refreshData(false),300000);}
function refreshData(manual){return loadServer().then(()=>{const h=location.hash||'#/';if(h==='#/'||h==='#'||h.startsWith('#/haberler')||h.startsWith('#/yorumlar')||h.startsWith('#/iletisim')||h.startsWith('#/ajanslar'))route();if(manual)toast('Veriler yenilendi · '+STATE.news.length+' haber')})}

/* dışa aktar düğmesi */
function newsList(q){return _newsList(q).replace(`onclick="toast('Dışa aktarıldı (CSV)')"`,'onclick="exportCSV()"')}
</script>
